name: update-stations

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:       # manual run button in the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Fetch, clean and profile the catalogue
        env:
          RADIOATLAS_USER_AGENT: "RadioAtlas/0.1 (+https://github.com/${{ github.repository }})"
        run: python pipeline/fetch_stations.py --save-raw --out data

      # The full catalogue is large and changes daily, so it is kept as a
      # workflow artifact instead of being committed to git.
      - uses: actions/upload-artifact@v4
        with:
          name: stations-data
          path: data/
          retention-days: 14

      # Only the small report files are committed, to track the funnel over time.
      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p docs/data
          cp data/report.md data/funnel.json docs/data/
          git add docs/data/
          git diff --staged --quiet || git commit -m "Update catalogue report"
          git pull --rebase
          git push
